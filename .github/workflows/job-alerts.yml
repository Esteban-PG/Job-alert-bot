name: Job alerts

on:
  # No `schedule:` trigger on purpose. The clock lives outside GitHub: an
  # external cron (cron-job.org) calls the workflow_dispatch REST endpoint every
  # 30 minutes:
  #
  #   POST /repos/Esteban-PG/Job-alert-bot/actions/workflows/job-alerts.yml/dispatches
  #   {"ref": "main"}
  #
  # Why not Actions' own cron:
  #
  # 1. It's unreliable. Actions cron schedules are best-effort: under load
  #    GitHub delays the run and, if the delay eats the next slot, it
  #    **discards** it. Measured over the first 34 runs with `*/30`: it ran 29%
  #    of what was scheduled, a median of 83 min between runs, and peaks of
  #    almost 4 h — even after moving to the less congested :07/:37.
  #
  # 2. It gets switched off. In public repos GitHub disables scheduled workflows
  #    after 60 days without repository activity. That happened on 2026-10-06
  #    (60 days after the last commit) and the bot was silent for a month,
  #    while every run had been green. That rule only applies to `schedule:`
  #    triggers, so a workflow started by dispatch is never disabled.
  #
  # Each run takes ~1.5 min; ~1440 runs/month on a public repo are free.
  workflow_dispatch:        # triggered by the external cron, or by hand
    inputs:
      dry_run:
        description: "Preview only — print what it would notify, send nothing, record nothing"
        type: boolean
        default: false

# Two runs in parallel would step on the seen-jobs database and could notify
# duplicates: make it wait for the previous one.
concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      # Persistence of seen_jobs.db between runs.
      #
      # Without this the runner starts clean every time, the database comes up
      # empty and the bot believes it's the first run: it seeds silently and
      # notifies NOTHING. Watch out for this one, it's counterintuitive — the
      # failure isn't receiving everything duplicated, it's never receiving
      # anything again, and from the outside it reads exactly like "no new
      # postings came up".
      #
      # The key carries the run_id (always different) so that each run saves a
      # new entry — Actions caches are immutable, overwriting an existing key
      # doesn't work. `restore-keys` with the prefix recovers the most recent
      # one. The `save` is a separate step with `always()` so the database gets
      # saved even if the bot ends in an error.
      # ---------------------------------------------------------------
      - name: Restore seen-jobs database
        uses: actions/cache/restore@v6
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Check the job boards
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Through the environment, not interpolated into the script. Empty on
          # a scheduled run, which is exactly what we want: cron never previews.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run — nothing will be sent and the database won't be written"
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Save seen-jobs database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
